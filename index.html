<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no stops pinch/double-tap zoom while writing -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kaki Katalyst</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>書き Katalyst</h1>
    <p class="sub">Stroke practice (step 1 test page)</p>
  </header>

  <main>
    <div class="controls">
      <label>Kanji
        <select id="kanji">
          <option value="食">食 (9 strokes)</option>
          <option value="人">人 (2 strokes)</option>
          <option value="水">水 (4 strokes)</option>
        </select>
      </label>
      <div class="segmented" role="group" aria-label="Mode">
        <button data-mode="trace" aria-pressed="true">Trace</button>
        <button data-mode="freehand" aria-pressed="false">Freehand</button>
      </div>
      <button id="hint">Hint</button>
      <button id="restart">Restart</button>
    </div>

    <canvas id="pad" aria-label="Writing area"></canvas>

    <p id="status" role="status" aria-live="polite"></p>
    <p id="result" hidden></p>
  </main>

  <footer>
    Stroke data from <a href="https://kanjivg.tagaini.net">KanjiVG</a> by Ulrich Apel, CC BY-SA 3.0.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
