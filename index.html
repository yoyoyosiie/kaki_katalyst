<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no stops pinch/double-tap zoom while writing -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kaki Katalyst</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>書き Katalyst</h1>
    <div class="controls">
      <label>Lesson <select id="lesson"></select></label>
      <button id="restart">Restart step</button>
    </div>
    <ol id="stages" aria-label="Lesson steps"></ol>
  </header>

  <main>
    <!-- Steps 1-4: one big box for the new kanji -->
    <section id="single" hidden>
      <canvas id="pad" aria-label="Writing area"></canvas>
      <div class="controls"><button id="hint">Hint</button></div>
    </section>

    <!-- Steps 5-6: the sentence, one box per character -->
    <section id="sentence" hidden>
      <p id="prompt"></p>
      <div id="boxes"></div>
      <p id="answer" hidden></p>
      <div class="controls"><button id="check">Check</button></div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <p id="result" hidden></p>
    <div class="controls"><button id="next" class="primary" hidden>Next</button></div>
    <div id="debug" hidden></div>
  </main>

  <footer>
    Stroke data from <a href="https://kanjivg.tagaini.net">KanjiVG</a> by Ulrich Apel, CC BY-SA 3.0.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
